; Copie este arquivo para db_config.ini e preencha com os dados do MySQL.
; O db_config.ini NÃO vai para o Git (está no .gitignore).
[mysql]
; IP do computador do MySQL na rede (usado pelos outros computadores)
host = 192.168.0.0
; Nome do computador onde o MySQL roda: nele o app conecta local (127.0.0.1)
server_name = NOME_DO_COMPUTADOR
user = seu_usuario
password = sua_senha
database = bd_vl_flooring
